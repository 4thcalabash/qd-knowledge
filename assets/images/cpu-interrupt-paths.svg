<svg xmlns="http://www.w3.org/2000/svg" width="920" height="190" viewBox="0 0 920 190" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#888"/>
    </marker>
  </defs>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#333">传统内核路径：三次执行流中断</text>

  <!-- 框1 -->
  <rect x="20" y="55" width="150" height="60" rx="6" fill="#eef4ff" stroke="#4a7ac7"/>
  <text x="95" y="80" text-anchor="middle" font-size="13" fill="#333">网卡收包</text>
  <text x="95" y="98" text-anchor="middle" font-size="11" fill="#888">DMA 写入 RX 队列</text>

  <line x1="170" y1="85" x2="203" y2="85" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 框2：硬中断 -->
  <rect x="205" y="55" width="150" height="60" rx="6" fill="#fff3e6" stroke="#d08a2e"/>
  <text x="280" y="80" text-anchor="middle" font-size="13" fill="#333">硬件中断 IRQ</text>
  <text x="280" y="98" text-anchor="middle" font-size="11" fill="#888">ISR 抢占当前任务</text>
  <text x="280" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="#d08a2e">执行流中断 #1</text>

  <line x1="355" y1="85" x2="388" y2="85" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 框3：软中断 -->
  <rect x="390" y="55" width="150" height="60" rx="6" fill="#fff3e6" stroke="#d08a2e"/>
  <text x="465" y="80" text-anchor="middle" font-size="13" fill="#333">NET_RX 软中断</text>
  <text x="465" y="98" text-anchor="middle" font-size="11" fill="#888">再次抢占</text>
  <text x="465" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="#d08a2e">执行流中断 #2</text>

  <line x1="540" y1="85" x2="573" y2="85" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 框4 -->
  <rect x="575" y="55" width="150" height="60" rx="6" fill="#eef4ff" stroke="#4a7ac7"/>
  <text x="650" y="80" text-anchor="middle" font-size="13" fill="#333">内核协议栈</text>
  <text x="650" y="98" text-anchor="middle" font-size="11" fill="#888">sk_buff / 锁</text>

  <line x1="725" y1="85" x2="758" y2="85" stroke="#888" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 框5 -->
  <rect x="760" y="55" width="145" height="60" rx="6" fill="#fff3e6" stroke="#d08a2e"/>
  <text x="832" y="80" text-anchor="middle" font-size="13" fill="#333">syscall(read)</text>
  <text x="832" y="98" text-anchor="middle" font-size="11" fill="#888">切换 + copy</text>
  <text x="832" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="#d08a2e">执行流中断 #3</text>

  <!-- 分隔说明 -->
  <text x="20" y="160" font-size="12" fill="#888">每次中断处理都伴随：上下文切换 · cache 局部性破坏 · 流水线清空</text>
</svg>
