---
layout: default
---
<article class="post">
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <time datetime="{{ page.date | date_to_xmlschema }}">
            {{ page.date | date: "%Y-%m-%d" }}
        </time>
        {% if page.model or page.tool %}
        <div class="post-coauthor">
            co-author: {% if page.model %}by {{ page.model }}{% endif %}{% if page.model and page.tool %}, {% endif %}{% if page.tool %}by {{ page.tool }}{% endif %}
        </div>
        {% endif %}
    </header>

    <div class="post-content">
        {{ content }}
    </div>

    <nav class="post-nav">
        <a href="{{ site.baseurl }}/">&larr; 返回首页</a>
    </nav>
</article>
