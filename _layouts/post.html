---
layout: default
---
<article class="post">
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <time datetime="{{ page.date | date_to_xmlschema }}">
            {{ page.date | date: "%Y-%m-%d" }}
        </time>
        {% if page.model or page.tool %}
        <span class="post-coauthor">· {{ page.model }} · {{ page.tool }}</span>
        {% endif %}
    </header>

    <div class="post-layout">
        <aside class="toc-sidebar" id="toc-sidebar" aria-label="章节目录"></aside>
        <div class="post-content">
            {{ content }}
        </div>
    </div>

    <nav class="post-nav">
        <a href="{{ site.baseurl }}/">&larr; 返回首页</a>
    </nav>
</article>
<script src="{{ site.baseurl }}/assets/js/toc.js"></script>
