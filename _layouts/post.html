---
layout: default
---
<article class="post">
    <header class="post-header">
        <h1>{{ page.title }}</h1>
        <time datetime="{{ page.date | date_to_xmlschema }}">
            {{ page.date | date: "%Y-%m-%d" }}
        </time>
    </header>

    <div class="post-content">
        {{ content }}
    </div>

    <nav class="post-nav">
        <a href="{{ site.baseurl }}/">&larr; 返回首页</a>
    </nav>
</article>
