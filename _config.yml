title: QD Knowledge
description: QD Cheatsheet, not a Tutorial
author: 4thcalabash
baseurl: "/qd-knowledge"
url: "https://4thcalabash.github.io"

markdown: kramdown
highlighter: rouge

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: true

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

plugins:
  - jekyll-feed
  - jekyll-seo-tag
